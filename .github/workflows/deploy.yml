name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ftp-deploy:
    name: 🎉 Deploy to Hostinger FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          # DANGEROUS: If a file isn't explicitly excluded below, the deployer might overwrite or delete it!
          # We explicitly protect these server directories to ensure Hostinger assets aren't ruined by Git syncs.
          exclude: |
            **/.git*
            **/.git*/**
            **/images/**
            **/cache/**
            **/tests/**
            **/.env
            **/audit_data.log
